name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # `pip install --group` requires pip >= 25.1.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --group dev

      - name: Ruff check
        run: python -m ruff check

      - name: Ruff format
        run: python -m ruff format --check

      - name: Pytest
        run: python -m pytest

  dbt-parse:
    name: dbt-parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values. dbt parse renders env_var and does not connect.
      SNOWFLAKE_ACCOUNT: ci-parse
      SNOWFLAKE_USER: ci-parse
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/ci-parse-dummy.p8
      SNOWFLAKE_WAREHOUSE: CI_PARSE
      SNOWFLAKE_ROLE: CI_PARSE
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # Runtime only. dbt-core and dbt-snowflake are in requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: dbt deps
        working-directory: transform
        run: dbt deps --profiles-dir .

      - name: dbt parse
        working-directory: transform
        run: dbt parse --profiles-dir .
