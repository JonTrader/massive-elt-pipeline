version: 2

models:
  - name: stg_daily_bars
    description: >
      Clean silver daily bars from RAW.DAILY_BARS. Vendor columns renamed and
      cast. Quality pass only (OHLCV present, high >= low, volume >= 0).
      No dedupe; delete-then-copy leaves one landing per date.
    columns:
      - name: ticker
        description: Symbol from vendor T.
        tests:
          - not_null
      - name: trade_date
        description: Session date from the loader; not re-derived from t.
        tests:
          - not_null
      - name: close
        description: Close price.
        tests:
          - not_null
      - name: open
        description: Open price.
        tests:
          - not_null
      - name: high
        description: High price.
        tests:
          - not_null
      - name: low
        description: Low price.
        tests:
          - not_null
      - name: volume
        description: Share volume.
        tests:
          - not_null
      - name: extracted_at
        description: Parquet S3 last-modified (UTC), not the manifest clock.
        tests:
          - not_null
      - name: window_start_epoch_ms
        description: Vendor bar timestamp t as epoch milliseconds.
      - name: vwap
        description: Volume-weighted average price.
      - name: transactions
        description: Transaction count from vendor n.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - trade_date

  - name: stg_daily_bars_quarantine
    description: >
      Rows from RAW.DAILY_BARS that fail quality (null OHLCV/ticker, high < low,
      or volume < 0). Complements stg_daily_bars so every RAW row lands in one
      place. Bronze remains the vendor payload.
    columns:
      - name: ticker
        description: Symbol from vendor T; may be null.
      - name: trade_date
        description: Session date from the loader when present.
      - name: close
        description: Close price; may be null.

unit_tests:
  - name: stg_daily_bars_accepts_only_the_clean_row
    description: >
      One RAW row passes quality. Null ticker, null open, high, low, close,
      or volume, high below low, and negative volume stay out. The passing
      row uses the staging names and casts.
    model: stg_daily_bars
    given:
      - input: "source('raw', 'DAILY_BARS')"
        format: sql
        fixture: raw_daily_bars_quality
    expect:
      rows:
        - ticker: AAPL
          open: 8
          high: 16
          low: 4
          close: 16
          volume: 100
          vwap: 10.5
          window_start_epoch_ms: 1001
          transactions: 40
          trade_date: "2024-01-02"
          extracted_at: "2024-01-02 21:00:00"

  - name: stg_daily_bars_quarantine_accepts_only_failed_rows
    description: >
      The same RAW fixture as stg_daily_bars_accepts_only_the_clean_row.
      Every failing row lands here, with the same names and casts, and the
      clean row does not. The two tests together keep each fixture row in
      exactly one model.
    model: stg_daily_bars_quarantine
    given:
      - input: "source('raw', 'DAILY_BARS')"
        format: sql
        fixture: raw_daily_bars_quality
    expect:
      rows:
        - ticker: null
          open: 8
          high: 10
          low: 6
          close: 9
          volume: 10
          vwap: 8
          window_start_epoch_ms: 1002
          transactions: 1
          trade_date: "2024-01-03"
          extracted_at: "2024-01-02 21:00:00"
        - ticker: NULL_O
          open: null
          high: 10
          low: 6
          close: 9
          volume: 10
          vwap: 8
